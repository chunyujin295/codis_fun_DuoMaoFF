version: '3.8'

services:
  web:
    build:
      context: .
      target: builder
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads_data:/app/uploads
      - prisma_data:/app/prisma
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/dev.db}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?请在 .env 中配置随机 NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000/DuoMaoFF}
      - NODE_ENV=development
    command: npm run dev
    restart: unless-stopped

volumes:
  uploads_data:
  prisma_data:
