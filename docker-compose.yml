version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
      - prisma_data:/app/prisma
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/dev.db}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?请在 .env 中配置随机 NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000/DuoMaoFF/api/auth}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/DuoMaoFF"]
      interval: 30s
      timeout: 10s
      retries: 3

  init:
    profiles: ["setup"]
    build:
      context: .
      target: database-tools
    volumes:
      - prisma_data:/app/prisma
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/dev.db}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?首次初始化前请设置 ADMIN_PASSWORD}

volumes:
  uploads_data:
  prisma_data:
